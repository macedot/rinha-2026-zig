x-api-common: &api-common
  image: ghcr.io/macedot/rinha-2026-zig:latest
  volumes:
    - rinha-zig-sock:/run/sock
  networks:
    - rinha-zig-net
  ulimits:
    nofile:
      soft: 65535
      hard: 65535
  deploy:
    resources:
      limits:
        cpus: "0.4"
        memory: "150M"
  environment: &api-env
    INDEX_PATH: "/app/data"
    UDS_MODE: "666"
    UNLINK_UDS: "1"

services:
  lb:
    image: jrblatt/so-no-forevis:v1.0.0
    container_name: rinha-zig-lb
    restart: always
    depends_on:
      - api1
      - api2
    environment:
      UPSTREAMS: "/run/sock/api1.sock,/run/sock/api2.sock"
      PORT: "9999"
      BUF_SIZE: "4096"
      WORKERS: "1"
    ports:
      - "9999:9999"
    volumes:
      - rinha-zig-sock:/run/sock
    networks:
      - rinha-zig-net
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: "30M"
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    # No seccomp:unconfined (matches final C discipline)

  api1:
    <<: *api-common
    container_name: rinha-zig-api1
    environment:
      <<: *api-env
      UDS_PATH: "/run/sock/api1.sock"

  api2:
    <<: *api-common
    container_name: rinha-zig-api2
    environment:
      <<: *api-env
      UDS_PATH: "/run/sock/api2.sock"

networks:
  rinha-zig-net:
    driver: bridge

volumes:
  rinha-zig-sock:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=10m
