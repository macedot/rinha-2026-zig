# Host networking variant — eliminates Docker bridge latency (~80μs)
# Requires Zig server to support TCP mode + SO_REUSEPORT
# See: https://github.com/macedot/rinha-2026-zig
#
# If server does NOT support TCP mode, use docker-compose.yml (UDS + passa)

x-api-common: &api-common
  image: ghcr.io/macedot/rinha-2026-zig:latest
  network_mode: host
  ulimits:
    nofile:
      soft: 65535
      hard: 65535
  deploy:
    resources:
      limits:
        cpus: "0.4"
        memory: "150M"
  environment: &api-env
    INDEX_PATH: "/app/resources/index.bin"
    LISTEN_TCP: "1"
    PORT: "9999"
    HOST: "0.0.0.0"
    TCP_NODELAY: "1"
    SO_REUSEPORT_ENABLED: "1"
    IVF_NPROBE: "8"
    IVF_FULL_NPROBE: "24"
    CANDIDATES: "0"

services:
  api1:
    <<: *api-common
    container_name: rinha-zig-api1

  api2:
    <<: *api-common
    container_name: rinha-zig-api2
